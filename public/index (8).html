<script>
(function(){
var $=function(i){return document.getElementById(i)},q=location.search,seen=false,
reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
try{seen=!!sessionStorage.getItem('film')}catch(e){}

/* Load the site in the background while the film plays */
var siteP=fetch('site.html',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text()}).catch(function(){return null});
function openSite(){siteP.then(function(txt){
  if(!txt){location.href='site.html';return}
  try{sessionStorage.setItem('film','1');sessionStorage.setItem('cin','1')}catch(e){}
  txt=txt.replace('<head>','<head><style>body{animation:sIn 1.1s cubic-bezier(.22,1,.36,1) both}@keyframes sIn{from{opacity:0}to{opacity:1}}</style>');
  document.open();document.write(txt);document.close()})}

/* Returning visitors, reduced motion, and payment returns go straight to the site. Add ?film to replay. */
if((seen||reduce||/session_id|paid=/.test(q))&&!/[?&]film/.test(q)){openSite();return}

var cv=$('cv'),x=cv.getContext('2d'),W,H,dpr=Math.min(2,devicePixelRatio||1),film=$('film');
var CD=[[140,207.1,419.6,'#a8752f',225.1,176.5],[172,167.0,420.8,'#b98332',185.0,217.8],[204,139.5,418.5,'#6fb98a',157.5,242.9],[236,119.6,412.2,'#d19a4a',137.6,256.6],[268,105.1,401.2,'#dba550',123.1,260.1],[300,94.7,384.3,'#6fb98a',112.7,253.6],[332,88.0,359.4,'#ecc47a',106.0,235.4],[364,84.3,321.6,'#f3d59a',102.3,201.3],[396,83.6,254.1,'#f3d59a',101.6,134.5]];
var LOGO='<svg class="lg" viewBox="60 70 380 400" aria-hidden="true">'+CD.map(function(c,i){return '<g class="cd" style="--i:'+i+'"><line x1="'+c[0]+'" y1="'+c[1]+'" x2="'+c[0]+'" y2="'+c[2]+'" stroke="'+c[3]+'" stroke-width="5" stroke-linecap="round"/><rect x="'+(c[0]-12)+'" y="'+c[4]+'" width="24" height="'+c[5]+'" rx="7" fill="'+c[3]+'"/></g>'}).join('')+'<path class="rib" pathLength="1" d="M128 396C196 340 292 250 378 130" fill="none" stroke="#f6f1e4" stroke-width="7" stroke-linecap="round"/><path class="stm" d="M132 394L88 444" stroke="#dba550" stroke-width="14" stroke-linecap="round"/><circle class="dot" cx="378" cy="130" r="15" fill="#f6f1e4"/><circle class="dot" cx="378" cy="130" r="6.5" fill="#3f7d5c"/></svg>';
var MW='Everyone deserves to understand the market before they risk a dollar in it.'.split(' '),MG={3:1,8:1};
var MISSION='<div class="eb">Our mission</div><h2>'+MW.map(function(w,k){return '<span class="w'+(MG[k]?' g':'')+'" style="--k:'+k+'">'+w+'</span>'}).join(' ')+'</h2>';
var SC=[
[0,4.6,'<div class="ln big" style="--d:.3s">The market moves fast.</div><div class="ln big dim" style="--d:2.2s">You don\'t have to.</div>'],
[4.6,9.2,'<div class="ln med" style="--d:.2s">Before the first trade,</div><div class="ln big gold" style="--d:1.6s">comes the first lesson.</div>'],
[9.2,15,MISSION],
[15,20.4,'<div class="eb">Built to be finished</div><div class="st"><div><b data-n="100">0</b><span>lessons, in order</span></div><div><b data-n="320">0</b><span>practice questions</span></div><div><b data-n="1">0</b><span>free first lesson</span></div></div>'],
[20.4,28,'<div class="ln no" style="--d:.2s"><s>Signals.</s></div><div class="ln no" style="--d:1.2s"><s>Hype.</s></div><div class="ln no" style="--d:2.2s"><s>Hurry.</s></div><div class="ln big gold" style="--d:3.8s">Just skills, in order.</div>'],
[28,34.5,'FLASH'+LOGO+'<h1>SAGE</h1><div class="tg">Learn to trade. Patiently.</div>'],
[34.5,null,'<div class="ln big" style="--d:.2s">Start with lesson one.</div><div class="ln med dim" style="--d:1.2s">It\'s free. No card needed.</div><button id="go" style="--d:2s" onclick="go()">Enter Sage</button><a id="again" href="#" style="--d:2.6s">\u21ba Watch again</a>']
],TOT=34.5,t=0,last=0,run=false,pau=false,act=[],seed=7,ac,mg,snd=true,raf,gone=false;

function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
var N=64,C=[],pr=100,i,P=[];for(i=0;i<N;i++){var o=pr,c=o+(rnd()-.42)*6+.55;C.push([o,Math.max(o,c)+rnd()*4,Math.min(o,c)-rnd()*4,c]);pr=c}
for(i=0;i<70;i++)P.push([rnd(),rnd(),.4+rnd()*1.6,.02+rnd()*.05]);
var mn=Math.min.apply(0,C.map(function(a){return a[2]})),mx=Math.max.apply(0,C.map(function(a){return a[1]}));
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}function cl(v){return Math.max(0,Math.min(1,v))}
function draw(){x.clearRect(0,0,W,H);var g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.6);g.addColorStop(0,'rgba(219,165,80,'+(.1+.1*Math.sin(t*.6))+')');g.addColorStop(1,'rgba(219,165,80,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
P.forEach(function(q){var y=((q[1]-t*q[3]*.1)%1+1)%1;x.fillStyle='rgba(243,213,154,'+(.15+.35*Math.abs(Math.sin(t+q[0]*9)))+')';x.beginPath();x.arc(q[0]*W,y*H,q[2],0,7);x.fill()});
var k=cl(t/TOT)*N,bw=W/N,top=H*.2,bot=H*.9,ys=function(v){return bot-(v-mn)/(mx-mn)*(bot-top)};
for(var i=0;i<N&&i<k+1;i++){var f=Math.min(1,k-i),c=C[i],up=c[3]>=c[0],px=i*bw+bw/2,col=up?'111,185,138':'200,90,60',m=(c[0]+c[3])/2,cy=function(v){return ys(m+(v-m)*f)};
x.strokeStyle='rgba('+col+',.3)';x.lineWidth=Math.max(1,bw*.08);x.beginPath();x.moveTo(px,cy(c[1]));x.lineTo(px,cy(c[2]));x.stroke();x.fillStyle='rgba('+col+','+(.18+.2*f)+')';var a=cy(c[0]),b=cy(c[3]);x.fillRect(px-bw*.3,Math.min(a,b),bw*.6,Math.max(2,Math.abs(a-b)))}
x.strokeStyle='rgba(243,213,154,.75)';x.lineWidth=2.2;x.shadowColor='#dba550';x.shadowBlur=14;x.beginPath();var e=Math.min(N-1,Math.floor(k));for(var j=0;j<=e;j++){var px2=j*bw+bw/2,py=ys(C[j][3]);j?x.lineTo(px2,py):x.moveTo(px2,py)}x.stroke();x.shadowBlur=0}
function tone(f,d,v,ty){if(!ac||!snd)return;try{var o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function boom(){if(!ac)return;try{var o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(90,ac.currentTime);o.frequency.exponentialRampToValueAtTime(28,ac.currentTime+2);g.gain.setValueAtTime(.9,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+2.4);o.connect(g);g.connect(mg);o.start();o.stop(ac.currentTime+2.5)}catch(e){}}
function pad(){try{var lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;lp.frequency.linearRampToValueAtTime(1400,ac.currentTime+28);var g=ac.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.16,ac.currentTime+6);lp.connect(g);g.connect(mg);[55,82.4,110,164.8].forEach(function(f,i){var o=ac.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=(i%2?6:-6);o.connect(lp);o.start()})}catch(e){}}
function enter(s,i){var d=document.createElement('div');d.className='sc';var h=s[2];if(h.indexOf('FLASH')==0){h=h.slice(5);$('fl').classList.remove('on');void $('fl').offsetWidth;$('fl').classList.add('on');boom()}d.innerHTML=h;film.appendChild(d);act.push({e:d,s:s,i:i,out:0});tone(660+i*60,.5,.12);
var a=d.querySelector('#again');if(a)a.onclick=function(ev){ev.preventDefault();play()}}
function tick(ts){if(!run)return;if(!last)last=ts;if(!pau)t+=(ts-last)/1000;last=ts;
SC.forEach(function(s,i){if(t>=s[0]&&!s.d){s.d=1;enter(s,i)}});
act=act.filter(function(a){var en=a.s[1];if(en!==null){if(t>=en-.8&&!a.out){a.out=1;a.e.classList.add('out')}if(t>=en+.1){a.e.remove();return false}}return true});
act.forEach(function(a){a.e.querySelectorAll('[data-n]').forEach(function(n){var l=cl((t-a.s[0]-.8)/2);n.textContent=Math.round(+n.dataset.n*(1-Math.pow(1-l,3)))})});
$('bar').style.width=cl(t/TOT)*100+'%';draw();raf=requestAnimationFrame(tick)}
function play(){film.innerHTML='';act=[];SC.forEach(function(s){s.d=0});t=0;last=0;run=false;$('gate').classList.add('off');
if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=snd?.5:0;mg.connect(ac.destination);pad()}catch(e){}}else{try{ac.resume()}catch(e){}}
pau=false;$('pz').textContent='Pause';film.classList.remove('paused');run=true;raf=requestAnimationFrame(tick)}

/* Leave the film: blur and glow out, then the site fades in */
function exit(ev){if(ev&&ev.preventDefault)ev.preventDefault();if(gone)return false;gone=true;run=false;cancelAnimationFrame(raf);
 try{if(mg)mg.gain.setTargetAtTime(0,ac.currentTime,.25)}catch(e){}
 var b=document.body;b.style.transition='opacity .8s cubic-bezier(.4,0,.2,1)';
 requestAnimationFrame(function(){b.style.opacity='0'});
 setTimeout(function(){try{if(ac)ac.close()}catch(e){}removeEventListener('resize',size);openSite()},880);
 return false}
window.go=exit;

$('play').onclick=play;
$('skip').onclick=exit;$('gskip').onclick=exit;
$('pz').onclick=function(){pau=!pau;film.classList.toggle('paused',pau);this.textContent=pau?'Play':'Pause';try{pau?ac.suspend():ac.resume()}catch(e){}};
$('snd').onclick=function(){snd=!snd;if(mg)mg.gain.value=snd?.5:0;this.textContent=snd?'Sound on':'Sound off'};
document.addEventListener('keydown',function(e){if(e.key==='Escape')exit(e)});
addEventListener('resize',size);size();draw();
})();
